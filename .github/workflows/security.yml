name: Security Baseline Scan

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  zap_baseline_scan:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📦 Checkout repo
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        run: |
          cd backend
          npm ci

      - name: 🚀 Start backend app
        run: |
          cd backend
          npm run start:test &
          sleep 10
        env:
          NODE_ENV: test
          ZAP_ENV: true
          DISABLE_EMAILS: true
          DISABLE_CAPTCHA: true
          DISABLE_RATE_LIMIT: true
          DISABLE_STEP_UP_AUTH: true
          USE_MEMORY_DB: false
          MONGO_URL_LOCAL: mongodb://127.0.0.1:27017/fullstackdb
          MONGO_URI: mongodb://127.0.0.1:27017/fullstackdb
          DB_NAME: fullstackdb
          PROD_DB_NAME: fullstackdb
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'Secret123$' }}
          PEPPER_SECRET: test_pepper_secret
          FRONTEND_URL: http://localhost:3000
          CORS_ORIGINS: http://localhost:3000,http://localhost:8080
          RESEND_API_KEY: fake_test_key
          EMAIL_FROM: Test <test@example.com>
          HCAPTCHA_SECRET: fake_hcaptcha_secret
          MP_ACCESS_TOKEN: fake_mp_token
          MP_BASE_URL: https://api.mercadopago.com
          EMAIL_ADMIN: admin@test.com
          PASS_ADMIN: admin_test_pass
          USE_REDIS_RATE_LIMIT: false
          USE_REDIS_TOKEN_STORE: false

      - name: 🕷️ Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:8080"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"
        continue-on-error: true

      - name: 💾 Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-reports
          path: |
            report_html.html
            report_json.json
            zap.out
          if-no-files-found: ignore


