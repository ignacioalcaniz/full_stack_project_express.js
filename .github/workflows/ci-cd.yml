name: CI/CD Fullstack Project

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      USE_MEMORY_DB: true
      DISABLE_EMAILS: true
      DISABLE_CAPTCHA: true
      DISABLE_RATE_LIMIT: true
      DISABLE_STEP_UP_AUTH: true
      RESEND_API_KEY: "fake_test_key"
      EMAIL_FROM: "Test <test@example.com>"
      FRONTEND_URL: "http://localhost:3000"
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'test_secret_key' }}
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v6

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 Verify npm signatures
        run: npm audit signatures || true

      - name: 🔍 Security audit
        run: npm audit --omit=dev --audit-level=high || true

      - name: 🧪 Run tests (Jest + Coverage)
        run: npm run test:ci

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v6

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 🏗️ Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ignacioalcaniz/fullstack-backend:latest

      - name: 🏗️ Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ignacioalcaniz/fullstack-frontend:latest










