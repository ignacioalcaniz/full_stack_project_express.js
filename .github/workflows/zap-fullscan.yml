name: OWASP ZAP Full Scan

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  zap_scan:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout código
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Red compartida backend + mongo
      - name: 🌐 Crear red compartida
        run: docker network create zapnet || true

      # MongoDB en la misma red
      - name: 🐳 Levantar MongoDB en Docker
        run: |
          docker run -d \
            --name mongo \
            --network zapnet \
            -p 27017:27017 \
            mongo:7

      - name: 🏗️ Build imagen backend
        run: docker build -t backend-app ./backend

      - name: 🚀 Levantar backend en Docker
        run: |
          docker run -d \
            --name backend-app \
            --network zapnet \
            -p 8080:8080 \
            -e NODE_ENV=production \
            -e DOCKER_ENV=true \
            -e ZAP_ENV=true \
            -e SKIP_ENV_CHECK=true \
            -e USE_MEMORY_DB=false \
            -e DB_NAME=test \
            -e MONGO_URL=mongodb://mongo:27017 \
            -e MONGO_URL_LOCAL=mongodb://mongo:27017 \
            -e JWT_SECRET=test_secret \
            -e FRONTEND_URL=http://localhost:3000 \
            backend-app

      - name: ⏳ Esperar backend
        run: |
          echo "Esperando que el backend responda..."
          for i in {1..60}; do
            if curl -sSf http://localhost:8080/health > /dev/null; then
              echo "✅ Backend listo en intento $i"
              exit 0
            fi
            echo "⏳ Intento $i... backend no disponible"
            sleep 5
          done
          echo "❌ Backend no inició a tiempo"
          docker logs backend-app
          exit 1

      - name: 🕷️ Ejecutar OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: "http://localhost:8080"
          cmd_options: "-a -T 600 -r zap_report.html -J zap_report.json -w zap_report.md"

      - name: 💾 Guardar reportes
        uses: actions/upload-artifact@v4
        with:
          name: zap_reports
          path: |
            zap_report.html
            zap_report.json
            zap_report.md

      - name: 🧹 Limpieza
        if: always()
        run: |
          docker logs backend-app || true
          docker rm -f backend-app || true
          docker rm -f mongo || true
          docker network rm zapnet || true















