name: OWASP ZAP Full Scan

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  security_scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - name: 📦 Checkout repo
        uses: actions/checkout@v4

      - name: 🌐 Crear red zapnet
        run: docker network create zapnet || true

      - name: 🐳 Levantar MongoDB
        run: |
          docker run -d \
            --name mongo \
            --network zapnet \
            -p 27017:27017 \
            mongo:7

      - name: 🏗️ Build backend
        run: docker build -t backend-app ./backend

      - name: 🚀 Levantar backend
        run: |
          docker run -d \
            --name backend-app \
            --network zapnet \
            -p 8080:8080 \
            -e NODE_ENV=test \
            -e DOCKER_ENV=true \
            -e ZAP_ENV=true \
            -e SKIP_ENV_CHECK=true \
            -e DISABLE_EMAILS=true \
            -e USE_MEMORY_DB=false \
            -e DB_NAME=test \
            -e PROD_DB_NAME=test \
            -e MONGO_URL=mongodb://mongo:27017 \
            -e JWT_SECRET=test_secret_key_for_zap \
            -e PEPPER_SECRET=test_pepper_secret_for_zap \
            -e FRONTEND_URL=http://localhost:3000 \
            -e CORS_ORIGINS=http://localhost:3000,http://localhost:8080 \
            -e EMAIL_FROM="Test <test@example.com>" \
            -e RESEND_API_KEY=fake_test_key \
            -e HCAPTCHA_SECRET=fake_hcaptcha_secret \
            -e MP_ACCESS_TOKEN=fake_mp_token \
            -e PASS_ADMIN=admin_test_pass \
            -e EMAIL_ADMIN=admin@test.com \
            -e USE_REDIS_RATE_LIMIT=false \
            -e USE_REDIS_TOKEN_STORE=false \
            backend-app

      - name: ⏳ Esperar backend
        run: |
          echo "⌛ Waiting for backend..."
          for i in {1..60}; do
            if curl -sSf http://localhost:8080/health > /dev/null; then
              echo "✅ Backend OK en intento $i"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Backend no respondió"
          docker logs backend-app
          exit 1

      - name: 🕷️ ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: "http://localhost:8080"
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-a -d"

      - name: 💾 Subir reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            report_html.html
            report_json.json
            report_md.md
            zap.out






































