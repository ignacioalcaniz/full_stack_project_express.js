name: OWASP ZAP Full Scan

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  zap_scan:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: 📦 Checkout repo
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 🌐 Crear red compartida
      - name: 🌐 Crear red zapnet
        run: docker network create zapnet || true

      # 🐳 MongoDB
      - name: 🐳 Levantar MongoDB
        run: |
          docker run -d \
            --name mongo \
            --network zapnet \
            -p 27017:27017 \
            mongo:7

      # 🏗️ Backend build
      - name: 🏗️ Build backend
        run: docker build -t backend-app ./backend

      # 🚀 Backend en modo ZAP / CI
      - name: 🚀 Levantar backend
        run: |
          docker run -d \
            --name backend-app \
            --network zapnet \
            -p 8080:8080 \
            -e NODE_ENV=production \
            -e DOCKER_ENV=true \
            -e ZAP_ENV=true \
            -e SKIP_ENV_CHECK=true \
            -e USE_MEMORY_DB=false \
            -e DB_NAME=test \
            -e MONGO_URL=mongodb://mongo:27017 \
            -e JWT_SECRET=test_secret \
            backend-app

      # 🕒 Esperar backend
      - name: ⏳ Esperar backend
        run: |
          echo "⌛ Waiting for backend..."
          for i in {1..60}; do
            if curl -sSf http://localhost:8080/health > /dev/null; then
              echo "Backend OK en intento $i"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Backend no respondió"
          docker logs backend-app
          exit 1

      # 🛡️ OWASP ZAP Full Scan
      - name: 🕷️ ZAP Full Scan
        id: zap
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: "http://localhost:8080"
          cmd_options: "-a -T 900 -r zap_report.html -J zap_report.json -w zap_report.md"

      # 📄 Guardar reportes
      - name: 💾 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zap_reports
          path: |
            zap_report.html
            zap_report.json
            zap_report.md

      # 🚨 QUALITY GATE HIGH / MEDIUM
      - name: 🚨 Evaluar vulnerabilidades
        run: |
          echo "📊 Analizando JSON..."
          HIGH=$(jq '.site[].alerts[] | select(.risk == "High")' zap_report.json | wc -l)
          MED=$(jq '.site[].alerts[] | select(.risk == "Medium")' zap_report.json | wc -l)
          echo "High: $HIGH"
          echo "Medium: $MED"
          if [ "$HIGH" -gt 0 ] || [ "$MED" -gt 0 ]; then
            echo "❌ Vulnerabilidades críticas detectadas"
            exit 1
          fi
          echo "✅ Sin vulnerabilidades HIGH/MEDIUM"

      # 💬 Comentario automático al PR
      - name: 💬 Comentar en PR
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            🛡️ **OWASP ZAP Scan Completed**
            - High: ${{ steps.zap.outputs.high }}
            - Medium: ${{ steps.zap.outputs.medium }}
            - Reporte HTML incluido como artefacto.


















