name: OWASP ZAP Scan

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  zap_security:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: 📦 Checkout repo
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🌐 Crear red zapnet
        run: docker network create zapnet || true

      - name: 🐳 MongoDB
        run: |
          docker run -d \
            --name mongo \
            --network zapnet \
            -p 27017:27017 \
            mongo:7

      - name: 🏗️ Build backend
        run: docker build -t backend-app ./backend

      - name: 🚀 Levantar backend
        run: |
          docker run -d \
            --name backend-app \
            --network zapnet \
            -p 8080:8080 \
            -e NODE_ENV=production \
            -e DOCKER_ENV=true \
            -e SKIP_ENV_CHECK=true \
            -e MONGO_URL=mongodb://mongo:27017 \
            -e JWT_SECRET=test_secret \
            backend-app

      - name: ⏳ Esperar backend
        run: |
          for i in {1..60}; do
            if curl -sSf http://localhost:8080/health > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      # 🛡️ ZAP BASELINE SCAN (Estable y sin bugs)
      - name: 🕷️ OWASP ZAP Baseline
        id: zap
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: "http://localhost:8080"
          cmd_options: "-J report_json.json -w report_md.md -r report_html.html"

      # 📄 Guardar reportes
      - name: 💾 Upload ZAP Reports
        uses: actions/upload-artifact@v4
        with:
          name: zap_reports
          path: |
            report_html.html
            report_json.json
            report_md.md

      # 🚨 Quality Gate
      - name: 🚨 Evaluar vulnerabilidades
        run: |
          echo "📊 Analizando JSON..."
          HIGH=$(jq '.site[].alerts[] | select(.risk == "High")' report_json.json | wc -l)
          MED=$(jq '.site[].alerts[] | select(.risk == "Medium")' report_json.json | wc -l)
          echo "High: $HIGH"
          echo "Medium: $MED"
          if [ "$HIGH" -gt 0 ] || [ "$MED" -gt 0 ]; then
            echo "❌ Vulnerabilidades críticas detectadas"
            exit 1
          fi
          echo "✅ Sin vulnerabilidades HIGH/MEDIUM"



























