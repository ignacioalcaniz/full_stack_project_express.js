name: OWASP ZAP Full Scan

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  security_scan:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: 📦 Checkout repo
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🌐 Crear red zapnet
        run: docker network create zapnet || true

      - name: 🐳 Levantar MongoDB
        run: |
          docker run -d \
            --name mongo \
            --network zapnet \
            -p 27017:27017 \
            mongo:7

      - name: 🏗️ Build backend
        run: docker build -t backend-app ./backend

      - name: 🚀 Levantar backend
        run: |
          docker run -d \
            --name backend-app \
            --network zapnet \
            -p 8080:8080 \
            -e NODE_ENV=production \
            -e DOCKER_ENV=true \
            -e ZAP_ENV=true \
            -e SKIP_ENV_CHECK=true \
            -e USE_MEMORY_DB=false \
            -e DB_NAME=test \
            -e MONGO_URL=mongodb://mongo:27017 \
            -e JWT_SECRET=test_secret \
            backend-app

      - name: ⏳ Esperar backend
        run: |
          echo "⌛ Waiting for backend..."
          for i in {1..60}; do
            if curl -sSf http://localhost:8080/health > /dev/null; then
              echo "Backend OK en intento $i"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Backend no respondió"
          docker logs backend-app
          exit 1

      - name: 🕷️ ZAP Full Scan
        id: zap
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: "http://localhost:8080"
          allow_issue_writing: false

      - name: 💾 Upload ZAP Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            report_html.html
            report_json.json
            report_md.md

      - name: 🚨 Evaluar vulnerabilidades
        run: |
          echo "📊 Analizando JSON..."
          HIGH=$(jq '.site[].alerts[] | select(.risk == "High")' report_json.json | wc -l)
          MED=$(jq '.site[].alerts[] | select(.risk == "Medium")' report_json.json | wc -l)
          echo "High: $HIGH"
          echo "Medium: $MED"
          if [ "$HIGH" -gt 0 ] || [ "$MED" -gt 0 ]; then
            echo "❌ Vulnerabilidades críticas detectadas"
            exit 1
          fi
          echo "✅ Sin vulnerabilidades HIGH/MEDIUM"

      - name: 💬 Comentar en PR
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            🛡️ **OWASP ZAP Scan Completed**
            - High: ${{ steps.zap.outputs.high }}
            - Medium: ${{ steps.zap.outputs.medium }}
            - Reports disponibles como artefactos.






















