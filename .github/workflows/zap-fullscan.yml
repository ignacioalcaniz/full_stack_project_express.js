name: OWASP ZAP Full Scan

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  zap_scan:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: 📦 Checkout código
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🧹 Limpiar dependencias viejas
        run: |
          cd backend
          rm -rf node_modules package-lock.json
          npm cache clean --force

      - name: 📦 Instalar dependencias
        run: |
          cd backend
          npm install --force --ignore-scripts

      - name: 🏗️ Build imagen backend
        run: docker build -t backend-app ./backend

      - name: 🌐 Crear red compartida
        run: docker network create zapnet || true

      - name: 🚀 Levantar backend en Docker
        run: |
          docker run -d \
            --name backend-app \
            --network zapnet \
            -p 8080:8080 \
            -e NODE_ENV=production \
            -e DOCKER_ENV=true \
            -e USE_MEMORY_DB=false \
            -e DB_NAME=test \
            -e MONGO_URL=mongodb://mongo:27017/test \
            -e JWT_SECRET=test_secret \
            -e FRONTEND_URL=http://localhost:3000 \
            backend-app

      - name: ⏳ Esperar a que el backend esté listo
        run: |
          echo "Esperando que el backend responda..."
          for i in {1..60}; do
            if curl -sSf http://localhost:8080/health > /dev/null; then
              echo "✅ Backend listo (intento $i)"
              exit 0
            fi
            echo "Intento $i: backend no disponible aún..."
            sleep 5
          done
          echo "❌ Backend no inició a tiempo"
          docker logs backend-app
          exit 1

      - name: 🕷️ Ejecutar OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: "http://localhost:8080"
          cmd_options: "-a -T 600 -r zap_report.html -J zap_report.json -w zap_report.md"

      - name: 💾 Guardar reportes de ZAP
        uses: actions/upload-artifact@v4
        with:
          name: zap_reports
          path: |
            zap_report.html
            zap_report.json
            zap_report.md

      - name: 🧹 Limpieza final
        if: always()
        run: |
          echo "🧹 Limpiando contenedores y red..."
          docker logs backend-app || true
          docker rm -f backend-app || true
          docker network rm zapnet || true






