name: OWASP ZAP Full Scan

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  security_scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: 📦 Checkout repo
        uses: actions/checkout@v4

      - name: 🌐 Crear red zapnet
        run: docker network create zapnet || true

      - name: 🐳 Levantar MongoDB
        run: |
          docker run -d \
            --name mongo \
            --network zapnet \
            -p 27017:27017 \
            mongo:7

      - name: 🏗️ Build backend
        run: docker build -t backend-app ./backend

      - name: 🚀 Levantar backend
        run: |
          docker run -d \
            --name backend-app \
            --network zapnet \
            -p 8080:8080 \
            -e NODE_ENV=production \
            -e DOCKER_ENV=true \
            -e ZAP_ENV=true \
            -e SKIP_ENV_CHECK=true \
            -e USE_MEMORY_DB=false \
            -e DB_NAME=test \
            -e MONGO_URL=mongodb://mongo:27017 \
            -e JWT_SECRET=test_secret \
            backend-app

      - name: ⏳ Esperar backend
        run: |
          echo "⌛ Waiting for backend..."
          for i in {1..60}; do
            if curl -sSf http://localhost:8080/health > /dev/null; then
              echo "✅ Backend OK"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Backend no respondió"
          docker logs backend-app
          exit 1

      # ✅ SCAN PROFESIONAL REAL (activo + pasivo)
      - name: 🕷️ Ejecutar OWASP ZAP (Modo Enterprise)
        run: |
          docker pull ghcr.io/zaproxy/zaproxy:stable

          docker run --network=host \
            -v $(pwd):/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t http://localhost:8080 \
            -r report_html.html \
            -J report_json.json \
            -w report_md.md \
            -a

      # ✅ Subida profesional de reportes
      - name: 💾 Subir reportes ZAP
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            report_html.html
            report_json.json
            report_md.md

      # ✅ Quality Gate empresarial
      - name: 🚨 Evaluar vulnerabilidades
        run: |
          sudo apt-get update && sudo apt-get install -y jq

          HIGH=$(jq '.site[].alerts[] | select(.risk == "High")' report_json.json | wc -l)
          MED=$(jq '.site[].alerts[] | select(.risk == "Medium")' report_json.json | wc -l)

          echo "High: $HIGH"
          echo "Medium: $MED"

          if [ "$HIGH" -gt 0 ] || [ "$MED" -gt 0 ]; then
            echo "❌ Vulnerabilidades detectadas"
            exit 1
          fi

          echo "✅ SISTEMA SEGURO - SCAN PASADO"



































